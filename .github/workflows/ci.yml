name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on macOS
    runs-on: macos-26
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint with ruff
        run: |
          uv run ruff check .

      - name: Check formatting
        run: |
          uv run ruff format --check . --exclude AGENTS.md

      - name: Type check with mypy
        run: |
          uv run mypy --config-file pyproject.toml src/prose

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=src/prose --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  compatibility-intel:
    name: Intel compatibility smoke test
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Verify Intel architecture and run tests
        run: |
          test "$(uname -m)" = "x86_64"
          uv run pytest -q

      - name: Smoke test Intel report generation
        run: |
          uv run macos-prose --quiet --no-prompt --mode fast
          uv run python -c "import json; r=json.load(open('output/macos_system_report.json')); assert r['report_schema'] == 'macos-system-prose/system-report'; assert r['report_schema_version'] == 1; assert r['system']['architecture'] == 'x86_64'"

  compatibility-arm64:
    name: Apple silicon compatibility smoke test
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Verify Apple silicon architecture and run tests
        run: |
          test "$(uname -m)" = "arm64"
          uv run pytest -q

      - name: Smoke test Apple silicon report generation
        run: |
          uv run macos-prose --quiet --no-prompt --mode fast
          uv run python -c "import json; r=json.load(open('output/macos_system_report.json')); assert r['report_schema'] == 'macos-system-prose/system-report'; assert r['report_schema_version'] == 1; assert r['system']['architecture'] == 'arm64'"
  integration-test:
    name: Integration Test - Full Report
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run full system report
        run: |
          uv run macos-prose --verbose

      - name: Verify JSON output
        run: |
          test -f output/macos_system_report.json
          uv run python -c "import json; json.load(open('output/macos_system_report.json'))"

      - name: Verify AI prompt output
        run: |
          test -f output/macos_system_report.txt
          test -s output/macos_system_report.txt

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
